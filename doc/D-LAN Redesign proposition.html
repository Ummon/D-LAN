document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"a0580369-8225-496e-9f31-ea20ef3cd934\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>\n  *{ box-sizing:border-box; }\n  html,body{ height:100%; margin:0; }\n  body{ font-family:\"Segoe UI\", system-ui, -apple-system, sans-serif; }\n  .dlan{\n    --bg-a:#dbe3ee; --bg-b:#eef1f6;\n    --surface:#ffffff; --surface-2:#f5f7fa; --surface-3:#eceff4;\n    --border:#e6eaf0; --border-strong:#d6dce4;\n    --text:#1b2230; --text-2:#5b6675; --text-3:#9099a8;\n    --accent:#2563eb; --accent-hover:#1d4ed8; --accent-soft:#e8eefc;\n    --success:#15a34a; --warn:#d97706; --danger:#dc2626;\n    --shadow:0 24px 64px rgba(24,38,66,.20);\n  }\n  .dlan[data-theme=\"dark\"]{\n    --bg-a:#0b0e13; --bg-b:#13171e;\n    --surface:#191d24; --surface-2:#1f242c; --surface-3:#262c35;\n    --border:#2a313b; --border-strong:#3a414d;\n    --text:#e9edf3; --text-2:#9aa4b2; --text-3:#646e7d;\n    --accent:#3b82f6; --accent-hover:#2f74e6; --accent-soft:#172540;\n    --success:#22b35a; --warn:#e0901f; --danger:#ef4444;\n    --shadow:0 28px 72px rgba(0,0,0,.6);\n  }\n  .dlan ::-webkit-scrollbar{ width:10px; height:10px; }\n  .dlan ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; border:2px solid transparent; background-clip:content-box; }\n  .dlan ::-webkit-scrollbar-track{ background:transparent; }\n  @keyframes dlanpulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }\n  @keyframes dlanbar{ 0%{ background-position:0 0; } 100%{ background-position:24px 0; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"dlan\" data-theme=\"{{ theme }}\" style=\"width:100%; height:100%; background:linear-gradient(135deg, var(--bg-a), var(--bg-b)); padding:18px; display:flex; align-items:stretch; justify-content:center;\">\n  <div style=\"flex:1; min-width:0; max-width:1240px; display:flex; flex-direction:column; background:var(--surface); border-radius:11px; overflow:hidden; box-shadow:var(--shadow); border:1px solid var(--border);\">\n\n    <!-- TITLE BAR -->\n    <div style=\"height:38px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 6px 0 14px; background:var(--surface-2); border-bottom:1px solid var(--border);\">\n      <div style=\"display:flex; align-items:center; gap:10px;\">\n        <div style=\"width:18px; height:18px; border-radius:5px; background:var(--accent); display:flex; align-items:center; justify-content:center;\">\n          <div style=\"width:8px; height:8px; border-radius:50%; border:2px solid #fff;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size:12.5px; font-weight:600; color:var(--text); letter-spacing:.2px;\">D-LAN<\u002Fspan>\n        <span style=\"font-size:11px; color:var(--text-3);\">— Local Area Network sharing<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:2px;\">\n        <div style=\"width:34px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--text-2); cursor:default;\" style-hover=\"background:var(--surface-3);\"><div style=\"width:10px; height:1.5px; background:currentColor;\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"width:34px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--text-2); cursor:default;\" style-hover=\"background:var(--surface-3);\"><div style=\"width:9px; height:9px; border:1.5px solid currentColor; border-radius:1.5px;\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"width:34px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--text-2); cursor:default; font-size:14px;\" style-hover=\"background:var(--danger); color:#fff;\">✕<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- TOOLBAR -->\n    <div style=\"height:56px; flex:none; display:flex; align-items:center; gap:14px; padding:0 16px; background:var(--surface); border-bottom:1px solid var(--border);\">\n      <div style=\"flex:none; display:flex; align-items:center; gap:8px; min-width:150px;\">\n        <span style=\"width:7px; height:7px; border-radius:50%; background:var(--success); animation:dlanpulse 2.4s ease-in-out infinite;\"><\u002Fspan>\n        <span style=\"font-size:12px; color:var(--text-2); font-weight:500;\">Connected · {{ peerCount }} peers<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1; max-width:520px; display:flex; align-items:center; gap:9px; height:38px; padding:0 13px; background:var(--surface-2); border:1px solid var(--border); border-radius:9px;\">\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--text-3)\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><line x1=\"21\" y1=\"21\" x2=\"16.5\" y2=\"16.5\"><\u002Fline><\u002Fsvg>\n        <input value=\"{{ query }}\" oninput=\"{{ onSearch }}\" placeholder=\"Search files across all peers…\" style=\"flex:1; border:none; outline:none; background:transparent; font-size:13px; color:var(--text); font-family:inherit;\">\n        <kbd style=\"font-size:10px; color:var(--text-3); border:1px solid var(--border-strong); border-radius:4px; padding:1px 5px; font-family:inherit;\">Ctrl K<\u002Fkbd>\n      <\u002Fdiv>\n      <div style=\"flex:1;\"><\u002Fdiv>\n      <div style=\"display:flex; align-items:center; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:2px;\">\n        <div onclick=\"{{ setSidebar }}\" style=\"font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:6px; cursor:pointer; background:{{ layoutStyle.side.bg }}; color:{{ layoutStyle.side.fg }};\">Sidebar<\u002Fdiv>\n        <div onclick=\"{{ setClassic }}\" style=\"font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:6px; cursor:pointer; background:{{ layoutStyle.tabs.bg }}; color:{{ layoutStyle.tabs.fg } n\n  addToQueue(f){\n    const d = { id:'q'+Date.now(), name:f.name, ext:f.ext, from:f.peer, size:f.size, progress:0, speed:'', eta:'', status:'queued' };\n    this.setState(s => ({ downloads:[...s.downloads, d], view:'downloads' }));\n  }\n  toggleDl(id){\n    this.setState(s => ({ downloads: s.downloads.map(d => {\n      if (d.id !== id) return d;\n      if (d.status === 'downloading') return { ...d, status:'paused' };\n      if (d.status === 'paused' || d.status === 'queued') return { ...d, status:'downloading', speed:d.speed||'18.0 MB/s' };\n      return d;\n    }) }));\n  }\n  removeDl(id){ this.setState(s => ({ downloads: s.downloads.filter(d => d.id !== id) })); }\n  move(id, dir){\n    this.setState(s => {\n      const arr = [...s.downloads];\n      const i = arr.findIndex(d => d.id === id);\n      const j = i + dir;\n      if (i < 0 || j < 0 || j >= arr.length) return {};\n      [arr[i], arr[j]] = [arr[j], arr[i]];\n      return { downloads: arr };\n    });\n  }\n\n  setRoom(r){ this.setState({ room:r }); }\n  onDraft(e){ this.setState({ draft:e.target.value }); }\n  send(){\n    const t = (this.state.draft||'').trim();\n    if (!t) return;\n    this.setState(s => {\n      const room = s.room;\n      const now = new Date();\n      const time = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');\n      return { chat: { ...s.chat, [room]: [...s.chat[room], { who:'you', time, text:t }] }, draft:'' };\n    });\n  }\n  onChatKey(e){ if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.send(); } }\n\n  openPeer(name){ this.setState({ selectedPeer:name, view:'browse' }); }\n\n  renderVals(){\n    const { theme, view, layout, query, room, draft, downloads, selectedPeer } = this.state;\n    const peers = this.peerData();\n    const peerCount = peers.filter(p => p.status !== 'idle').length;\n    const navActive = id => ({ bg: view===id?'var(--accent-soft)':'transparent', fg: view===id?'var(--accent)':'var(--text-2)' });\n    const activeDl = downloads.filter(d => d.status !== 'complete').length;\n\n    const navDefs = [\n      { id:'search', label:'Search' },\n      { id:'downloads', label:'Downloads', badge: activeDl ? String(activeDl) : '' },\n      { id:'uploads', label:'Uploads' },\n      { id:'chat', label:'Chat', badge:'2' },\n      { id:'browse', label:'Browse files' },\n      { id:'settings', label:'Settings' },\n      { id:'log', label:'Log' },\n    ];\n    const navs = navDefs.map(n => {\n      const a = navActive(n.id);\n      return {\n        id:n.id, label:n.label, go:() => this.setView(n.id),\n        bg:a.bg, fg:a.fg, badge:n.badge,\n        badgeBg: view===n.id?'var(--accent)':'var(--surface-3)',\n        badgeFg: view===n.id?'#fff':'var(--text-2)',\n        isSearch:n.id==='search', isDownloads:n.id==='downloads', isUploads:n.id==='uploads',\n        isChat:n.id==='chat', isBrowse:n.id==='browse', isSettings:n.id==='settings', isLog:n.id==='log',\n      };\n    });\n    const tabs = navDefs.map(n => ({\n      label:n.label, go:() => this.setView(n.id), badge:n.badge,\n      fg: view===n.id?'var(--accent)':'var(--text-2)',\n      under: view===n.id?'var(--accent)':'transparent',\n    }));\n\n    // search\n    const q = query.trim().toLowerCase();\n    const results = this.files().filter(f => !q || f.name.toLowerCase().includes(q)).map(f => {\n      const pm = this.meta(f.peer);\n      return { ...f, badge:this.badgeColor(f.ext), peerColor:pm.color, peerInitial:pm.initials.slice(0,1), onDownload:() => this.addToQueue(f) };\n    });\n\n    // downloads\n    const statusMap = {\n      downloading: { color:'var(--accent)', bar:'var(--accent)' },\n      complete:    { color:'var(--success)', bar:'var(--success)' },\n      paused:      { color:'var(--text-3)', bar:'var(--text-3)' },\n      queued:      { color:'var(--text-3)', bar:'var(--text-3)' },\n    };\n    const playIcon = '<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14 ?'var(--surface)':'transparent',\n      fg: room===r?'var(--text)':'var(--text-2)',\n      unread: r==='general'||r==='music',\n    }));\n    const messages = (this.state.chat[room]||[]).map(m => {\n      const pm = this.meta(m.who);\n      return { ...m, who: m.who==='you'?'You':m.who, color:pm.color, initials:pm.initials, nameColor: m.who==='you'?'var(--accent)':'var(--text)' };\n    });\n\n    // browse\n    const bpm = this.meta(selectedPeer);\n    const bp = peers.find(p => p.name===selectedPeer) || { shared:'' };\n    const fileIcon = '<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--text-3)\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3v5h5\"><\u002Fpath><path d=\"M7 3h7l5 5v11a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z\"><\u002Fpath><\u002Fsvg>';\n    const folderIcon = '<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"><\u002Fpath><\u002Fsvg>';\n    const tree = [\n      { name:'4k-renders', size:'12 items', isFolder:true, isFile:false, action:'Queue all' },\n      { name:'tutorials', size:'8 items', isFolder:true, isFile:false, action:'Queue all' },\n      { name:'demo-reel-4k.mp4', size:'2.1 GB', isFolder:false, isFile:true, action:'Get' },\n      { name:'cycles-benchmark.blend', size:'340 MB', isFolder:false, isFile:true, action:'Get' },\n      { name:'character-rig-v4.blend', size:'118 MB', isFolder:false, isFile:true, action:'Get' },\n      { name:'readme.txt', size:'2 KB', isFolder:false, isFile:true, action:'Get' },\n    ];\n\n    // settings\n    const shares = [\n      { path:'D:\\\\Shared\\\\Media', info:'412 GB · 2,184 files' },\n      { path:'D:\\\\Games\\\\Installers', info:'318 GB · 96 files' },\n      { path:'C:\\\\Users\\\\Greg\\\\LAN', info:'112 GB · 540 files' },\n    ];\n\n    // log\n    const logs = [\n      { time:'14:09', color:'var(--accent)', text:'jenny_m joined #lan-party' },\n      { time:'14:05', color:'var(--success)', text:'Finished downloading Blender-demo-reel-4k.mp4 from BOB-DESKTOP' },\n      { time:'14:02', color:'var(--text-3)', text:'Indexed 2,184 files in D:\\\\Shared\\\\Media' },\n      { time:'13:58', color:'var(--accent)', text:'kevin-pc came online — sharing 2.4 TB' },\n      { time:'13:51', color:'var(--warn)', text:'Paused Game-mods-pack.7z (peer mira went away)' },\n      { time:'13:40', color:'var(--success)', text:'Upload to jenny_m started: family-reunion-4k.mp4' },\n    ];\n\n    const peerRows = peers.map(p => {\n      const pm = this.meta(p.name);\n      const sc = p.status==='online'?'var(--success)':(p.status==='away'?'var(--warn)':'var(--text-3)');\n      return { name:p.name, shared:p.shared, color:pm.color, initials:pm.initials, statusColor:sc, busy:p.busy, onOpen:() => this.openPeer(p.name) };\n    });\n\n    return {\n      theme, layout,\n      isSidebar: layout==='sidebar', isClassic: layout==='classic',\n      setSidebar:() => this.setState({ layout:'sidebar' }), setClassic:() => this.setState({ layout:'classic' }),\n      layoutStyle: {\n        side: { bg: layout==='sidebar'?'var(--surface)':'transparent', fg: layout==='sidebar'?'var(--text)':'var(--text-3)' },\n        tabs: { bg: layout==='classic'?'var(--surface)':'transparent', fg: layout==='classic'?'var(--text)':'var(--text-3)' },\n      },\n      toggleTheme:() => this.toggleTheme(),\n      themeLabel: theme==='light'?'Light':'Dark',\n      themeIcon: theme==='light'?'☀':'☾',\n      query, onSearch:(e) => this.onSearch(e),\n      peerCount, navs, tabs,\n      isSearch:view==='search', isDownloads:view==='downloads', isUploads:view==='uploads',\n      isChat:view==='chat', isBrowse:view==='browse', isSettings:view==='settings', isLog:view==='log',\n      searchTitle: q ? 'Results for “'+query.trim()+'”' : 'Search the network',\n      searchSubtitle: q ? 'Indexed matches across all connected peers.' : 'Popular files shared right now — start typing to search everything.',\n      resultCount: results.length, results,\n      downloads:dls, dlSummary,\n      uploads,\n      rooms, room, messages, draft, onDraft:(e)=>this.onDraft(e), onChatKey:(e)=>this.onChatKey(e), sendChat:()=>this.send(),\n      selectedPeer, browsePeerColor:bpm.color, browsePeerInitial:bpm.initials, browsePeerShared:bp.shared, tree,\n      shares, logs, peers:peerRows,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
